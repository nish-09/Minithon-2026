# Production-shaped stack: PostgreSQL + API + web. NOT exercised in the authoring environment (no Docker there);
# the API was tested against real PostgreSQL via an embedded server instead (see README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nexa
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: ${NEXA_DB_PASSWORD:?set NEXA_DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      NEXA_ENVIRONMENT: production
      NEXA_DATABASE_URL: postgresql+psycopg://nexa:${NEXA_DB_PASSWORD}@db:5432/nexa
      NEXA_JWT_SECRET: ${NEXA_JWT_SECRET:?set NEXA_JWT_SECRET}
      NEXA_CORS_ORIGINS: ${NEXA_WEB_ORIGIN:-http://localhost:3000}
      NEXA_ANTHROPIC_API_KEY: ${NEXA_ANTHROPIC_API_KEY:-}
    ports: ["8000:8000"]
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXA_PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
